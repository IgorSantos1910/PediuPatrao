<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Usuário</title></head>
<body>
<h1 class="h4 mb-0" layout:fragment="titulo" th:text="${usuarioId == null} ? 'Novo usuário' : 'Editar usuário'">Usuário</h1>
<section layout:fragment="content">
    <div class="card card-form">
        <div class="card-body">
            <form th:action="${usuarioId == null} ? @{/usuarios/salvar} : @{/usuarios/editar/{id}(id=${usuarioId})}"
                  th:object="${usuario}" method="post">
                <div class="form-group">
                    <label for="username">Login</label>
                    <input id="username" type="text" th:field="*{username}" class="form-control" required
                           pattern="[A-Za-z0-9._\-]{3,30}">
                </div>
                <div class="form-group">
                    <label for="password" th:text="${usuarioId == null} ? 'Senha' : 'Nova senha (deixe em branco para manter)'">Senha</label>
                    <input id="password" type="password" name="password" class="form-control" autocomplete="new-password"
                           th:required="${usuarioId == null}" minlength="6">
                </div>
                <div class="form-group">
                    <label for="role">Perfil</label>
                    <select id="role" th:field="*{role}" class="form-control" required>
                        <option value="">Selecione...</option>
                        <option th:each="p : ${perfis}" th:value="${p}" th:text="${p.descricao + ' (' + p + ')'}">perfil</option>
                    </select>
                    <small class="text-muted">O perfil é validado no servidor. Você não pode alterar o seu próprio perfil.</small>
                </div>
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</section>
</body>
</html>
