<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Cliente</title></head>
<body>
<h1 class="h4 mb-0" layout:fragment="titulo" th:text="${cliente.id == null} ? 'Novo cliente' : 'Editar cliente'">Cliente</h1>
<section layout:fragment="content">
    <div class="card card-form">
        <div class="card-body">
            <p class="text-muted" th:if="${cliente.id != null}">Toda alteração (especialmente endereço e telefone) é registrada na auditoria com o valor anterior e o novo.</p>
            <form th:action="${cliente.id == null} ? @{/clientes/salvar} : @{/clientes/editar/{id}(id=${cliente.id})}"
                  th:object="${cliente}" method="post">
                <div class="form-row">
                    <div class="form-group col-md-8">
                        <label for="nome">Nome</label>
                        <input id="nome" type="text" th:field="*{nome}" class="form-control" required>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="telefone">Telefone</label>
                        <input id="telefone" type="text" th:field="*{telefone}" class="form-control" placeholder="(11) 99999-0000" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-3">
                        <label for="cep">CEP</label>
                        <input id="cep" type="text" th:field="*{cep}" class="form-control">
                    </div>
                    <div class="form-group col-md-7">
                        <label for="logradouro">Logradouro</label>
                        <input id="logradouro" type="text" th:field="*{logradouro}" class="form-control">
                    </div>
                    <div class="form-group col-md-2">
                        <label for="numero">Número</label>
                        <input id="numero" type="text" th:field="*{numero}" class="form-control">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label for="complemento">Complemento</label>
                        <input id="complemento" type="text" th:field="*{complemento}" class="form-control">
                    </div>
                    <div class="form-group col-md-3">
                        <label for="bairro">Bairro</label>
                        <input id="bairro" type="text" th:field="*{bairro}" class="form-control">
                    </div>
                    <div class="form-group col-md-3">
                        <label for="cidade">Cidade</label>
                        <input id="cidade" type="text" th:field="*{cidade}" class="form-control">
                    </div>
                    <div class="form-group col-md-2">
                        <label for="estado">UF</label>
                        <input id="estado" type="text" th:field="*{estado}" class="form-control" maxlength="2">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</section>
</body>
</html>
