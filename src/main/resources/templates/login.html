<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - PediuPatrão</title>
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
</head>
<body class="hold-transition login-page">
<div class="login-box">
    <div class="login-logo"><b>Pediu</b>Patrão</div>
    <div class="card">
        <div class="card-body login-card-body">
            <p class="login-box-msg">Entre com seu usuário</p>
            <div th:if="${param.error}" class="alert alert-danger">Usuário ou senha inválidos.</div>
            <div th:if="${param.logout}" class="alert alert-info">Você saiu do sistema.</div>
            <!-- th:action adiciona o campo oculto _csrf -->
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <input type="text" name="username" class="form-control" placeholder="Usuário" required autofocus>
                </div>
                <div class="form-group">
                    <input type="password" name="password" class="form-control" placeholder="Senha" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
